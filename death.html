<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aztec News</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        .headlines-container {
            display: flex;
            justify-content: space-between;
            max-width: 900px;
            margin: 30px auto;
            gap: 40px;
            text-align: left;
        }

        .headline-column {
            flex: 1; 
        }

        .headline-column h2 {
            font-size: 18px;
            border-bottom: 2px solid #333;
            padding-bottom: 5px;
            margin-bottom: 10px;
        }

        .news-text {
            font-size: 13px;
            line-height: 1.5;
            margin: 8px 0;
        }

        .wrapper {
            margin-top: 20px; 
        }

        .button {
            padding: 6px 40px;
            font-size: 16px;
            cursor: pointer;
        }


        @media (max-width: 600px) {
            .headlines-container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <h1>Aztec News!</h1>
    <p>Girl is found dead at island where Predator, Johnny was at.</p>
  <p>She was last seen in 2015, as suspicious man talked to her through call, then proceeds to take her to the island.</p>
  <p>Last message she made before suiciding by hanging.</p>
  <img src="images/suicide.PNG" alt="Last text which was seen under a chair.">
    <div class="wrapper">
        <button class="button">Go Back</button>
    </div>
  

</body>
</html>
